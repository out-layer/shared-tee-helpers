[package]
name = "custody-core"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Agent On-chain custody: the bytes that are signed, and the rules that are pure. No I/O."

# The whole list is the claim "no I/O": nothing here opens a socket, reads a
# clock or draws randomness.
[dependencies]
borsh = "1.5"
bs58 = "0.5"
ed25519-dalek = { version = "2.1", default-features = false }
hex = "0.4"
hmac = "0.12"
sha2 = "0.10"
sha3 = "0.10"

[dev-dependencies]
# The contract these bytes are for, at the commit of its two-key standard:
# the tests hash and verify against the code that runs on chain.
defuse-wallet = { git = "https://github.com/out-layer/intents", rev = "26acfe2f8f309ebdf84e8408f0368d58ed36ca2c", features = ["borsh", "digest"] }
defuse-wallet-two-key = { git = "https://github.com/out-layer/intents", rev = "26acfe2f8f309ebdf84e8408f0368d58ed36ca2c" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
