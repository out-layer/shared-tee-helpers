[package]
name = "shared-tee-helpers"
version = "0.1.0"
edition = "2021"

[dependencies]
# Crypto — near-crypto verifies ed25519, secp256k1 and ml-dsa-65 (FIPS-204 post-quantum)
# signatures uniformly, using the same aws-lc-rs ML-DSA backend nearcore signs with.
near-crypto = "0.37"
sha2 = "0.10"
hex = "0.4"
rand = "0.8"
bs58 = "0.5"

# HTTP client (for NEAR RPC view_access_key)
reqwest = { version = "0.11", features = ["json"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Error handling
anyhow = "1.0"
thiserror = "1.0"

# Async runtime (for retry delays)
tokio = { version = "1", features = ["time"] }

# Logging
tracing = "0.1"
